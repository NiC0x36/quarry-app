name: Check Quarry Local

# Run deliberately. No automatic releases, version changes, signing secrets or Telegram.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and check
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - name: Inspect packaged privacy settings
        run: node scripts/verify-analysis-apk.cjs app/build/outputs/apk/debug/app-debug.apk app/build/analysis-apk-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quarry-local-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/analysis-apk-check.json
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
